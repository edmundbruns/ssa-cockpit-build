name: Windows Installer
# Current verified build
# Use the current Windows runner
# Public build retry

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features bundled-sqlite
      - run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: SSA-Cockpit-Windows-Installer
          path: src-tauri/target/release/bundle/**
